version: 2

models:
  - name: stg_customers
    description: "Dados de clientes normalizados."
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null

  - name: stg_products
    description: "Dados de produtos normalizados."
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: price
        data_tests:
          - not_null

  - name: stg_orders
    description: "Dados de encomendas normalizados."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_order_items
    description: "Linhas individuais das encomendas."
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests:
          - not_null

  - name: stg_payments
    description: "Pagamentos associados às encomendas."
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id